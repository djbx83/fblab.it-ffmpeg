name: packages-publish

# Pubblica su packages.fblab.it:
#  - gli artifact cifrati di un workflow chiamante (workflow_call)
#  - qualunque file caricato via SFTP in incoming/<archive>/{deb/<suite>,win64/<subdir>}/
#    (controllo orario: se incoming è vuoto il run termina in pochi secondi)

on:
  workflow_call:
    inputs:
      artifact_pattern:
        description: 'Pattern artifact cifrati da pubblicare (vuoto = solo incoming)'
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  check:
    name: Check incoming
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.check.outputs.work }}
    steps:
      - name: Checkout
        if: ${{ !inputs.artifact_pattern }}
        uses: actions/checkout@v7

      - name: Install lftp
        if: ${{ !inputs.artifact_pattern }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp

      - name: Check
        id: check
        env:
          ARTIFACT_PATTERN: ${{ inputs.artifact_pattern }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -euo pipefail
          if [[ -n "$ARTIFACT_PATTERN" ]]; then
            echo "work=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          source repo/lib.sh
          sftp_setup
          n="$(lf_try "find $REMOTE_DIR/incoming" | grep -v '/$' | grep -vc '/\.htaccess$' || true)"
          echo "File in incoming: $n"
          if (( n > 0 )); then echo "work=true"; else echo "work=false"; fi >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: check
    if: needs.check.outputs.work == 'true'
    runs-on: ubuntu-latest
    environment: publish
    # Una sola pubblicazione alla volta, da qualunque workflow arrivi
    concurrency:
      group: packages-fblab-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        if: ${{ inputs.artifact_pattern }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact_pattern }}
          merge-multiple: true
          path: enc

      - name: Decrypt
        if: ${{ inputs.artifact_pattern }}
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p staging
          for f in enc/*.tar.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:ARTIFACT_KEY -in "$f" | tar -C staging -xf -
          done
          find staging -type f | sort

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apt-utils lftp

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Publish
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          KEEP: ${{ vars.KEEP_VERSIONS || '3' }}
        run: bash repo/publish.sh staging

      # Nei repo pubblici GitHub disabilita i workflow schedulati dopo 60 giorni
      # senza attività sul repository: li riabilitiamo a ogni pubblicazione.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in nightly.yml publish.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/$wf/enable" || true
          done
