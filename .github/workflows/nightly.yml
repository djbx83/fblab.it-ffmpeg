name: ffmpeg-nightly

on:
  schedule:
    # Orario volutamente "non tondo" (richiesta esplicita di FFmpeg-Builds
    # per non sovraccaricare le infrastrutture upstream dei download)
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Carica i pacchetti in incoming/ di packages.fblab.it'
        type: boolean
        default: true

# Nessun trigger su push/pull_request: i secrets non devono mai essere
# esposti a workflow avviati da fork.

permissions:
  contents: read
  packages: write

concurrency:
  group: ffmpeg-nightly
  cancel-in-progress: false

env:
  FFBUILDS_REPO: https://github.com/BtbN/FFmpeg-Builds.git
  FFBUILDS_REF: ${{ vars.FFBUILDS_REF || 'master' }}
  VARIANT: nonfree
  DOCKER_BUILDKIT: 1

jobs:
  # ---------------------------------------------------------------------------
  # Immagine base comune + cache dei sorgenti delle dipendenze
  # ---------------------------------------------------------------------------
  base:
    name: Base image + download cache
    runs-on: ubuntu-latest
    outputs:
      ffbuilds_sha: ${{ steps.src.outputs.sha }}
      registry: ${{ steps.names.outputs.registry }}
      dl_cache_key: ${{ steps.dl.outputs.key }}
      build_date: ${{ steps.names.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout FFmpeg-Builds
        id: src
        run: |
          git clone --filter=blob:none "$FFBUILDS_REPO" ffbuilds
          git -C ffbuilds checkout "$FFBUILDS_REF"
          # Librerie aggiuntive (scripts.d di questo repo) sopra quelle di FFmpeg-Builds
          cp -v scripts.d/*.sh ffbuilds/scripts.d/
          echo "sha=$(git -C ffbuilds rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Names
        id: names
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: ./ffbuilds/util/free_disk_space.sh

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: ffbuilds/.github/buildkit.toml

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build base image
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: ffbuilds/images/base
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.names.outputs.registry }}/base:latest
          cache-from: type=registry,ref=${{ steps.names.outputs.registry }}/base:cache
          cache-to: type=registry,mode=max,ref=${{ steps.names.outputs.registry }}/base:cache

      - name: Download cache key
        id: dl
        working-directory: ffbuilds
        run: echo "key=download-cache-$(./util/get_dl_cache_tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Download cache
        uses: actions/cache@v6
        with:
          path: ffbuilds/.cache/downloads
          key: ${{ steps.dl.outputs.key }}
          restore-keys: download-cache-

      - name: Update downloads
        working-directory: ffbuilds
        run: |
          ./download.sh
          ./util/clean_cache.sh

  # ---------------------------------------------------------------------------
  # Immagine dipendenze per target + build ffmpeg + packaging
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux64
            debarch: amd64
          - target: linuxarm64
            debarch: arm64
          - target: win64
            debarch: ''
    env:
      REGISTRY_IMG: ${{ needs.base.outputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout FFmpeg-Builds
        run: |
          git clone --filter=blob:none "$FFBUILDS_REPO" ffbuilds
          git -C ffbuilds checkout "${{ needs.base.outputs.ffbuilds_sha }}"
          cp -v scripts.d/*.sh ffbuilds/scripts.d/

      - name: Free disk space
        run: ./ffbuilds/util/free_disk_space.sh

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: ffbuilds/.github/buildkit.toml

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build target base image
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: ffbuilds/images/base-${{ matrix.target }}
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            GH_REPO=${{ env.REGISTRY_IMG }}
          tags: ${{ env.REGISTRY_IMG }}/base-${{ matrix.target }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY_IMG }}/base-${{ matrix.target }}:cache
          cache-to: type=registry,mode=max,ref=${{ env.REGISTRY_IMG }}/base-${{ matrix.target }}:cache

      - name: Restore download cache
        uses: actions/cache/restore@v6
        with:
          path: ffbuilds/.cache/downloads
          key: ${{ needs.base.outputs.dl_cache_key }}
          fail-on-cache-miss: true

      - name: Generate Dockerfile
        working-directory: ffbuilds
        run: ./generate.sh ${{ matrix.target }} "$VARIANT"

      - name: Build dependencies image
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: ffbuilds
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY_IMG }}/${{ matrix.target }}-${{ env.VARIANT }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY_IMG }}/${{ matrix.target }}-${{ env.VARIANT }}:cache
          cache-to: type=registry,mode=max,ref=${{ env.REGISTRY_IMG }}/${{ matrix.target }}-${{ env.VARIANT }}:cache

      - name: Build ffmpeg
        id: build
        working-directory: ffbuilds
        run: ./build.sh ${{ matrix.target }} "$VARIANT"

      - name: Package
        env:
          BUILD_NAME: ${{ steps.build.outputs.build_name }}
          BUILD_DATE: ${{ needs.base.outputs.build_date }}
          MAINTAINER: ${{ vars.DEB_MAINTAINER }}
        run: |
          set -euo pipefail
          # Layout di incoming/ di packages.fblab.it:
          #   deb/<suite>/<component>/*.deb   windows/<pacchetto>/*
          if [[ "${{ matrix.target }}" == win* ]]; then
            D=out/windows/ffmpeg; mkdir -p "$D"
            UP="${BUILD_NAME#ffmpeg-}"; UP="${UP%-${{ matrix.target }}-${VARIANT}}"
            cp "ffbuilds/artifacts/${BUILD_NAME}.zip" "$D/ffmpeg-${BUILD_DATE}-${UP}-win64-nonfree.zip"
            cp "ffbuilds/artifacts/${BUILD_NAME}.zip" "$D/ffmpeg-latest-win64-nonfree.zip"
          else
            D=out/deb/stable/non-free; mkdir -p "$D"
            bash packaging/build-deb.sh "ffbuilds/artifacts/${BUILD_NAME}.tar.xz" "${{ matrix.debarch }}" "$D"
          fi
          find out -type f -exec ls -la {} +

      - name: Upload to incoming
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp
          bash packaging/upload-incoming.sh out

  # Nei repo pubblici GitHub disabilita i workflow schedulati dopo 60 giorni
  # senza attività sul repository: lo riabilitiamo a ogni run.
  keepalive:
    name: Keepalive
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/enable" || true
