name: packages-site-config

# Pubblica .htaccess e .htpasswd di packages.fblab.it. Solo manuale.
on:
  workflow_dispatch:
    inputs:
      wipe_legacy:
        description: 'Cancella deb/ keys/ repo/ del primo test'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp apache2-utils

      - name: Deploy
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          HTPASSWD: ${{ secrets.HTPASSWD }}
          HTPASSWD_USER: ${{ secrets.HTPASSWD_USER }}
          HTPASSWD_PASSWORD: ${{ secrets.HTPASSWD_PASSWORD }}
          HTPASSWD_REMOTE: ${{ vars.HTPASSWD_REMOTE }}
          HTPASSWD_PATH: ${{ vars.HTPASSWD_PATH }}
          WIPE_LEGACY: ${{ inputs.wipe_legacy && 'yes' || 'no' }}
        run: bash repo/deploy-site.sh
